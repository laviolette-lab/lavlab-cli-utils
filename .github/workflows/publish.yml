name: Publish to PyPI

# Runs after build.yml ("Build wheels") succeeds for a v* tag and publishes the
# wheels it built -- no second Nuitka compile. Not `on: release`: build.yml
# creates the release with GITHUB_TOKEN, and events caused by GITHUB_TOKEN
# never trigger other workflows.
on:
  workflow_run:
    workflows: ["Build wheels"]
    types: [completed]

permissions:
  actions: read   # download artifacts from the build run
  id-token: write # PyPI trusted publishing

jobs:
  pypi:
    name: Publish to PyPI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lavlab-cli-utils
    steps:
      # Each Python packaging leg produces the same py3-none platform wheel;
      # publish the copy tested with 3.11 (the minimum supported interpreter).
      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: lavlab-wheel-py3.11
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: lavlab-wheel-linux-py3.11
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what will be published
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
