name: Run Pytest and Codecov

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            ice-repo: zeroc-ice-py-linux-x86_64
            ice-tag: "20240202"
            ice-wheel: zeroc_ice-3.6.5-cp311-cp311-manylinux_2_28_x86_64.whl
          - name: macos-arm64
            runs-on: ["self-hosted", "macOS", "ARM64"]
            ice-repo: zeroc-ice-py-macos-universal2
            ice-tag: "20240131"
            ice-wheel: zeroc_ice-3.6.5-cp311-cp311-macosx_11_0_universal2.whl
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # zeroc-ice 3.6.5 has no PyPI wheels, so `pip install ".[dev]"` can't
      # resolve omero-py. Same Glencoe wheel and pins as build.yml.
      - name: Download zeroc-ice wheel from Glencoe
        run: |
          curl -fL -O \
            "https://github.com/glencoesoftware/${ICE_REPO}/releases/download/${ICE_RELEASE_TAG}/${ICE_WHEEL}"
          ls -lh "${ICE_WHEEL}"
        env:
          ICE_REPO: ${{ matrix.ice-repo }}
          ICE_RELEASE_TAG: ${{ matrix.ice-tag }}
          ICE_WHEEL: ${{ matrix.ice-wheel }}

      - name: Install zeroc-ice and omero-py
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "${ICE_WHEEL}"
          pip install omero-py==5.21.0
          python -c "import omero.gateway, Ice; print('Ice', Ice.stringVersion())"
        env:
          ICE_WHEEL: ${{ matrix.ice-wheel }}

      - name: Install libvips
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list vips >/dev/null 2>&1 || brew install vips
          else
            sudo apt-get update
            sudo apt-get install -y libvips-dev
          fi

      # Deliberately not `pip install .`: that runs setup.py's build_py, i.e. a
      # full Nuitka compile. Tests import from src/ via pytest's pythonpath.
      - name: Install test dependencies
        run: |
          pip install -r build-requirements.txt
          pip install pytest pytest-cov "coverage[toml]>=6.2"

      - name: Run pytest and generate coverage report
        run: |
          pytest --cov=src --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.name }}
          path: ${{ github.workspace }}/coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: laviolette-lab/lavlab-cli-utils
