name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-native:
    name: Build macOS arm64 native binary (Python 3.12)
    # Apple Silicon larger runner; LTO of the full Ice module set exceeds
    # memory on the standard macOS runner.
    runs-on: macos-14-xlarge
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libvips
        run: brew install vips

      - name: Restore Nuitka ccache
        uses: actions/cache@v4
        with:
          path: |
            build/nuitka-cache
            ~/.cache/ccache
          key: nuitka-macos-py3.12-v2-${{ hashFiles('build-requirements.txt', 'build_native.py', 'nuitka_plugin.py', 'setup.py') }}
          restore-keys: |
            nuitka-macos-py3.12-v2-

      - name: Download zeroc-ice wheel from Glencoe
        run: |
          curl -fL -O \
            "https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/${ICE_RELEASE_TAG}/${ICE_WHEEL}"
          ls -lh "${ICE_WHEEL}"
        env:
          ICE_RELEASE_TAG: "20240131"
          ICE_WHEEL: "zeroc_ice-3.6.5-cp312-cp312-macosx_11_0_universal2.whl"

      - name: Install native build requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "${ICE_WHEEL}"
          pip install omero-py==5.21.0
          python -c "import omero.gateway, Ice; print('Ice', Ice.stringVersion())"
          pip install -r build-requirements.txt
        env:
          ICE_WHEEL: "zeroc_ice-3.6.5-cp312-cp312-macosx_11_0_universal2.whl"

      - name: Build the native binary
        run: LAVLAB_TARGET=macos-arm64 python setup.py bdist_wheel
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/build/nuitka-cache

      - name: Upload Nuitka crash report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-crash-report-macos
          path: nuitka-crash-report.xml
          if-no-files-found: ignore

      - name: Assert onefile executable was staged
        run: test -x src/lavlab/bin/dist/lavlab-bin

      - name: Run tests and smoke-test native binary
        run: |
          pip install pytest
          python -m pytest -q
          chmod +x src/lavlab/bin/dist/lavlab-bin
          out=$(./src/lavlab/bin/dist/lavlab-bin --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac
        env:
          LAVLAB_BINARY: src/lavlab/bin/dist/lavlab-bin

      - name: Archive native distribution
        run: tar -C src/lavlab/bin -czf dist/lavlab-macos-arm64.tar.gz dist

      - name: Upload native distribution for packaging jobs
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-native-macos-arm64
          path: dist/lavlab-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Attach native distribution to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lavlab-macos-arm64.tar.gz
          fail_on_unmatched_files: true

  build-linux-native:
    name: Build Linux x86_64 native binary (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gcc/build tooling and libvips
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache libvips-dev

      - name: Restore Nuitka ccache
        uses: actions/cache@v4
        with:
          path: |
            build/nuitka-cache
            ~/.cache/ccache
          key: nuitka-linux-py3.12-v2-${{ hashFiles('build-requirements.txt', 'build_native.py', 'nuitka_plugin.py', 'setup.py') }}
          restore-keys: |
            nuitka-linux-py3.12-v2-

      - name: Download zeroc-ice wheel from Glencoe (Linux x86_64)
        run: |
          curl -fL -O \
            "https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/${ICE_RELEASE_TAG}/${ICE_WHEEL}"
          ls -lh "${ICE_WHEEL}"
        env:
          ICE_RELEASE_TAG: "20240202"
          ICE_WHEEL: "zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl"

      - name: Install native build requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "${ICE_WHEEL}"
          pip install omero-py==5.21.0
          python -c "import omero.gateway, Ice; print('Ice', Ice.stringVersion())"
          pip install -r build-requirements.txt
        env:
          ICE_WHEEL: "zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl"

      - name: Build the native binary
        run: LAVLAB_TARGET=linux-x86_64 python setup.py bdist_wheel
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/build/nuitka-cache

      - name: Upload Nuitka crash report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-crash-report-linux
          path: nuitka-crash-report.xml
          if-no-files-found: ignore

      - name: Report largest Linux onefile bundle files
        run: |
          python - <<'PY'
          from pathlib import Path

          build_root = Path("build/nuitka")
          dist_dirs = sorted(build_root.glob("*.dist"))
          if not dist_dirs:
              print(f"No Nuitka .dist directory under {build_root}")
              raise SystemExit(0)

          for dist in dist_dirs:
              files = sorted(
                  (path for path in dist.rglob("*") if path.is_file()),
                  key=lambda path: path.stat().st_size,
                  reverse=True,
              )
              total = sum(path.stat().st_size for path in files)
              print(f"\n{dist}: {total / 1_000_000:.1f} MB across {len(files)} files")
              for path in files[:40]:
                  print(f"{path.stat().st_size / 1_000_000:8.1f} MB  {path.relative_to(dist)}")
          PY

      - name: Assert onefile executable was staged
        run: test -x src/lavlab/bin/dist/lavlab-bin

      - name: Run tests and smoke-test native binary
        run: |
          pip install pytest
          python -m pytest -q
          chmod +x src/lavlab/bin/dist/lavlab-bin
          out=$(./src/lavlab/bin/dist/lavlab-bin --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac
        env:
          LAVLAB_BINARY: src/lavlab/bin/dist/lavlab-bin

      - name: Archive native distribution
        run: tar -C src/lavlab/bin -czf dist/lavlab-linux-x86_64.tar.gz dist

      - name: Upload native distribution for packaging jobs
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-native-linux-x86_64
          path: dist/lavlab-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Attach native distribution to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lavlab-linux-x86_64.tar.gz
          fail_on_unmatched_files: true

  package-macos:
    name: Package macOS wheel with Python ${{ matrix.python-version }}
    needs: build-macos-native
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download native distribution
        uses: actions/download-artifact@v4
        with:
          name: lavlab-native-macos-arm64
          path: native-artifact/

      - name: Prepare prebuilt native distribution
        run: |
          mkdir prebuilt
          tar -xzf native-artifact/lavlab-macos-arm64.tar.gz -C prebuilt

      - name: Build wheel without recompiling the binary
        run: python -m pip install --upgrade pip setuptools wheel && python setup.py bdist_wheel
        env:
          LAVLAB_TARGET: macos-arm64
          LAVLAB_PREBUILT_DIST: prebuilt/dist

      - name: Assert wheel is below PyPI's file-size limit
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel was built")
          for wheel in wheels:
              size = wheel.stat().st_size
              print(f"{wheel}: {size / 1_000_000:.1f} MB")
              if size >= 100_000_000:
                  raise SystemExit(f"{wheel} exceeds PyPI's 100 MB file limit")
          PY

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/lavlab-smoke
          /tmp/lavlab-smoke/bin/pip install dist/*.whl
          out=$(/tmp/lavlab-smoke/bin/lavlab --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac
          for sub in lr roi tile geojson seg meta; do
            subout=$(/tmp/lavlab-smoke/bin/lavlab "$sub" --help) || exit 1
            [ -n "$subout" ] || { echo "$sub --help produced no output"; exit 1; }
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Attach macOS wheel to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true

  package-linux:
    name: Package Linux wheel with Python ${{ matrix.python-version }}
    needs: build-linux-native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download native distribution
        uses: actions/download-artifact@v4
        with:
          name: lavlab-native-linux-x86_64
          path: native-artifact/

      - name: Prepare prebuilt native distribution
        run: |
          mkdir prebuilt
          tar -xzf native-artifact/lavlab-linux-x86_64.tar.gz -C prebuilt

      - name: Build wheel without recompiling the binary
        run: python -m pip install --upgrade pip setuptools wheel && python setup.py bdist_wheel
        env:
          LAVLAB_TARGET: linux-x86_64
          LAVLAB_PREBUILT_DIST: prebuilt/dist

      - name: Assert wheel is below PyPI's file-size limit
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel was built")
          for wheel in wheels:
              size = wheel.stat().st_size
              print(f"{wheel}: {size / 1_000_000:.1f} MB")
              if size >= 100_000_000:
                  raise SystemExit(f"{wheel} exceeds PyPI's 100 MB file limit")
          PY

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Dockerfile.runtime build context
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        run: cp -r prebuilt/dist lavlab-dist

      - name: Build and push runtime image to GHCR
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/laviolette-lab/lavlab-cli-utils:${{ github.ref_name }}
            ghcr.io/laviolette-lab/lavlab-cli-utils:latest

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/lavlab-smoke
          /tmp/lavlab-smoke/bin/pip install dist/*.whl
          out=$(/tmp/lavlab-smoke/bin/lavlab --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac
          for sub in lr roi tile geojson seg meta; do
            subout=$(/tmp/lavlab-smoke/bin/lavlab "$sub" --help) || exit 1
            [ -n "$subout" ] || { echo "$sub --help produced no output"; exit 1; }
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-wheel-linux-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Attach Linux wheel to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
